[project]
name = "structnode"
version = "0.0.1"
description = "AI-native, solver-neutral structural engineering platform (CEM core)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "scipy>=1.12",
    "typer>=0.12",
    "fastapi>=0.110",
]

[project.scripts]
structnode = "structnode.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/structnode"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "mypy>=1.9",
    "ruff>=0.4",
    "scipy-stubs>=1.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["structnode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
